<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf2f8" />
      <stop offset="50%" stop-color="#f3e8ff" />
      <stop offset="100%" stop-color="#fae8ff" />
    </linearGradient>
    <linearGradient id="brandAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e91e8c" />
      <stop offset="100%" stop-color="#6b2d8c" />
    </linearGradient>
  </defs>

  <rect width="600" height="750" fill="url(#bgGrad)" />

  <!-- Stylized Decorative Rings -->
  <circle cx="300" cy="300" r="180" fill="none" stroke="#e91e8c" stroke-width="3" stroke-opacity="0.2" stroke-dasharray="10 10" />
  <circle cx="300" cy="300" r="150" fill="url(#brandAccent)" fill-opacity="0.1" />

  <!-- Avatar / Silhouette -->
  <circle cx="300" cy="240" r="85" fill="url(#brandAccent)" />
  <path d="M170 480 C 170 370, 430 370, 430 480 Z" fill="url(#brandAccent)" />

  <!-- Certified Mixologist / Cocktail Shaker Icon -->
  <g transform="translate(300, 310)">
    <circle cx="0" cy="0" r="36" fill="#ffffff" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.1))" />
    <path d="M-10 -15 L10 -15 L14 15 L-14 15 Z" fill="#6b2d8c" />
    <rect x="-8" y="-22" width="16" height="5" rx="2" fill="#e91e8c" />
  </g>

  <!-- Name & Title Tagline -->
  <text x="300" y="560" font-family="'Dancing Script', cursive, Georgia, serif" font-size="52" font-weight="bold" fill="#6b2d8c" text-anchor="middle">
    Kunbi
  </text>
  <text x="300" y="600" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="18" font-weight="bold" fill="#e91e8c" text-anchor="middle" letter-spacing="2">
    FOUNDER &amp; CERTIFIED MIXOLOGIST
  </text>
  <text x="300" y="630" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="600" fill="#6b7280" text-anchor="middle">
    Event Coordinator • Mushin, Lagos State
  </text>

  <!-- Helpful replace notice -->
  <rect x="80" y="665" width="440" height="42" rx="21" fill="#ffffff" stroke="#e91e8c" stroke-width="1.5" stroke-dasharray="4 4" />
  <text x="300" y="691" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="600" fill="#6b2d8c" text-anchor="middle">
    Replace this file at: /public/images/founder.jpg
  </text>
</svg>
