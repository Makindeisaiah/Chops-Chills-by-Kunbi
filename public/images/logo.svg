<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e91e8c" />
      <stop offset="50%" stop-color="#a82496" />
      <stop offset="100%" stop-color="#6b2d8c" />
    </linearGradient>
    <linearGradient id="softGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#fdf2f8" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <!-- Outer Circular Emblem -->
  <circle cx="250" cy="250" r="236" fill="url(#brandGrad)" />
  <circle cx="250" cy="250" r="222" fill="#ffffff" />
  <circle cx="250" cy="250" r="214" fill="url(#brandGrad)" fill-opacity="0.08" stroke="#e91e8c" stroke-width="2" stroke-dasharray="6 6" />

  <!-- Center Decorative Circle -->
  <circle cx="250" cy="185" r="72" fill="url(#brandGrad)" />

  <!-- Cocktail & Chops Icon Motif -->
  <!-- Cocktail Glass Silhouette -->
  <path d="M225 155 L275 155 L250 195 Z" fill="#ffffff" />
  <rect x="247" y="195" width="6" height="28" fill="#ffffff" rx="2" />
  <path d="M232 223 L268 223" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />
  <!-- Garnish / Citrus slice -->
  <circle cx="272" cy="154" r="10" fill="#fbcfe8" stroke="#ffffff" stroke-width="2" />
  <circle cx="272" cy="154" r="3" fill="#e91e8c" />

  <!-- Sparkles / Chill stars -->
  <path d="M214 168 Q218 168 218 164 Q218 168 222 168 Q218 168 218 172 Q218 168 214 168 Z" fill="#ffffff" />
  <path d="M284 192 Q287 192 287 189 Q287 192 290 192 Q287 192 287 195 Q287 192 284 192 Z" fill="#ffffff" />

  <!-- Brand Typography -->
  <!-- Main Script Wordmark -->
  <text x="250" y="305" font-family="'Dancing Script', cursive, Georgia, serif" font-size="52" font-weight="bold" fill="#6b2d8c" text-anchor="middle">
    Chops &amp; Chills
  </text>

  <!-- by Kunbi Banner -->
  <rect x="145" y="330" width="210" height="34" rx="17" fill="url(#brandGrad)" />
  <text x="250" y="353" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="3">
    BY KUNBI
  </text>

  <!-- Tagline / Location -->
  <text x="250" y="395" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="600" fill="#a82496" text-anchor="middle" letter-spacing="1.5">
    FOOD • DRINKS • EVENTS
  </text>
  <text x="250" y="420" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="500" fill="#6b7280" text-anchor="middle">
    Mushin, Lagos State
  </text>
</svg>
